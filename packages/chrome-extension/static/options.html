<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tsforge — Chrome extension</title>
    <style>
      :root { color-scheme: light dark; font: 14px/1.5 system-ui, sans-serif; }
      body { max-width: 560px; margin: 32px auto; padding: 0 16px; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; margin-top: 4px; }
      button { margin-top: 16px; padding: 6px 16px; font: inherit; }
      #status { margin-top: 20px; padding: 8px 12px; border-radius: 6px; background: rgba(37, 99, 235, 0.12); }
      p.note { color: GrayText; }
    </style>
  </head>
  <body>
    <h1>tsforge</h1>
    <p>
      Lets your local tsforge session read pages in this browser — read and navigate only, inside a
      “tsforge” tab group. It cannot type, post, or submit anything.
    </p>
    <label for="token">Pairing token</label>
    <input id="token" type="password" autocomplete="off" placeholder="run /browser in tsforge and paste the token" />
    <label for="port">Port</label>
    <input id="port" type="number" min="1024" max="65535" />
    <button id="save" type="button">Save</button>
    <div id="status"></div>
    <p class="note">
      To let tsforge take over a tab, keep it active when you ask, or click the tsforge toolbar button on it.
    </p>
    <script type="module" src="options.js"></script>
  </body>
</html>
